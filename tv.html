<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D1117;--surface:#161B22;--s2:#1C2533;--border:#30404F;
  --green:#00C88C;--red:#FF4D4D;--yellow:#FFD700;--blue:#00BFFF;
  --text:#E6EDF3;--muted:#8B949E;
  --page-dur:20s;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px}
#slides{position:absolute;inset:0;width:1920px;height:var(--slide-h,1080px)}
.slide{position:absolute;inset:0;width:1920px;height:var(--slide-h,1080px);display:none;flex-direction:column;overflow:hidden}
.slide.active{display:flex}

/* ── Header ── */
.header{display:flex;align-items:center;padding:0 44px;border-bottom:1px solid var(--border);height:80px;flex-shrink:0;gap:22px}
.header-logo{font-size:24px;font-weight:800;color:var(--green);letter-spacing:-0.5px;white-space:nowrap}
.header-divider{width:1px;height:32px;background:var(--border)}
.header-squad{font-size:28px;font-weight:800;color:#fff;letter-spacing:-0.5px;white-space:nowrap}
.header-title{font-size:32px;font-weight:800;color:#fff;flex:1;letter-spacing:-0.5px;line-height:1}
.header-page{font-size:18px;font-weight:700;color:#C0CAD4;white-space:nowrap}
.header-date{font-size:14px;color:var(--muted);white-space:nowrap}

/* ── Body ── */
.body{flex:1;padding:24px 40px 12px;overflow:hidden;display:flex;flex-direction:column;gap:0}

/* ── Table ── */
.tbl-wrap{flex:1;overflow:hidden;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}
table{width:100%;border-collapse:separate;border-spacing:0 8px;table-layout:fixed;flex:1}
thead th{background:var(--s2);color:var(--muted);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:20px 20px;text-align:center;position:sticky;top:0;z-index:2;border-bottom:2px solid var(--border)}
thead th:first-child{text-align:left;font-size:19px;color:var(--text);padding-left:28px}
tbody td{padding:28px 20px;text-align:center;font-size:26px;font-weight:600;color:var(--text);line-height:1.3;vertical-align:middle}
tbody td:first-child{text-align:left;font-size:24px;font-weight:700;color:#fff;word-wrap:break-word;padding-left:28px}
tbody tr{background:rgba(22,27,34,0.6);border-radius:8px}
tbody tr:nth-child(even){background:rgba(28,37,51,0.5)}
tbody tr td:first-child{border-left:4px solid var(--green)}
tbody tr.row-total{background:rgba(33,150,83,0.12);border-top:2px solid var(--green);border-bottom:2px solid var(--green)}
tbody tr.row-total td{font-weight:700;font-size:18px}
tbody tr.row-total td:first-child{border-left:4px solid #21D375}
/* Valores numéricos */
.num{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700}
.num.muted{color:var(--muted)}
/* Variação % */
.var{font-size:24px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.var.pos{color:var(--green)}
.var.neg{color:var(--red)}
.var.neu{color:var(--muted)}
/* Sublabel */
.sublabel{font-size:14px;color:var(--muted);font-weight:500;margin-top:2px}

/* ── Navegação por clique nas bordas ── */
.nav-zone{position:absolute;top:0;bottom:0;width:80px;z-index:100;cursor:pointer;opacity:0;transition:opacity .3s}
.nav-zone:hover{opacity:1}
.nav-zone.left{left:0;background:linear-gradient(to right, rgba(0,200,140,0.08), transparent)}
.nav-zone.right{right:0;background:linear-gradient(to left, rgba(0,200,140,0.08), transparent)}
.nav-zone .arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:32px;color:var(--muted);font-weight:300}
.nav-zone.left .arrow{left:20px}
.nav-zone.right .arrow{right:20px}

/* ── Progress bar ── */
.progress-bar{position:fixed;bottom:0;left:0;right:0;height:5px;background:var(--border);z-index:9999}
.progress-fill{height:100%;background:var(--green);transition:width .3s}
</style>
</head>

// ── Helpers ──────────────────────────────────────────────────────────────────
const fmt = n => {
  if(n==null||n===undefined) return '—';
  if(typeof n==='string') return n;
  return Math.round(n).toLocaleString('pt-BR');
};
const fmtPct = v => {
  if(v==null||v===undefined) return '—';
  const x = v*100;
  return (x>0?'+':'')+x.toFixed(1)+'%';
};
const varClass = (v, isCancel=false) => {
  if(v==null||v===undefined) return 'neu';
  const pos = v>=0;
  return (pos===!isCancel) ? 'pos' : 'neg';
};
const varArrow = v => v==null?'':v>=0?'▲':'▼';

// ── Build slides ──────────────────────────────────────────────────────────────
const slides = [];
const container = document.getElementById('slides');
const genDate = window.DATA.generated_at;
const squads = window.DATA.squads;

// Total de páginas: 4 squads × 2 (Vendas + Cancelamentos) = 8
const totalPages = squads.length * 2;
let pageNum = 0;

squads.forEach(squad => {
  // ── Página de Vendas ──
  pageNum++;
  const slideV = document.createElement('div');
  slideV.className = 'slide';

  let rowsV = '';
  squad.products.forEach(prod => {
    const v = prod.vendas;
    const diaLabel = v.vendas_dia_label || 'D-1';
    const horaTxt = v.hora_atual != null ? ` <span class="sublabel">(${v.hora_atual}h)</span>` : '';
    const var4sCls = varClass(v.var_pct_vs_4s, false);
    const varMtCls = varClass(v.var_pct_mtd_vs_mes_anterior, false);
    const varFcCls = varClass(v.var_pct_mtd_vs_forecast, false);
    const varOrCls = varClass(v.var_pct_mtd_vs_orcamento, false);

    const trClsV = prod.is_total ? ' class="row-total"' : '';
    rowsV += `<tr${trClsV}>
      <td>${prod.name}</td>
      <td><span class="num">${fmt(v.vendas_ontem)}</span></td>
      <td><span class="num">${fmt(v.vendas_dia)}</span>${horaTxt}</td>
      <td><span class="var ${var4sCls}">${varArrow(v.var_pct_vs_4s)} ${fmtPct(v.var_pct_vs_4s)}</span></td>
      <td><span class="num">${fmt(v.mtd)}</span></td>
      <td><span class="var ${varMtCls}">${varArrow(v.var_pct_mtd_vs_mes_anterior)} ${fmtPct(v.var_pct_mtd_vs_mes_anterior)}</span></td>
      <td><span class="num">${fmt(v.meta_forecast_total)}</span><br><span class="var ${varFcCls}" style="font-size:18px">${varArrow(v.var_pct_mtd_vs_forecast)} ${fmtPct(v.var_pct_mtd_vs_forecast)}</span></td>
      <td><span class="num">${fmt(v.meta_orcamento_total)}</span><br><span class="var ${varOrCls}" style="font-size:18px">${varArrow(v.var_pct_mtd_vs_orcamento)} ${fmtPct(v.var_pct_mtd_vs_orcamento)}</span></td>
    </tr>`;
  });

  slideV.innerHTML = `
    <div class="header">
      <div class="header-logo">PicPay</div>
      <div class="header-divider"></div>
      <div class="header-squad">${squad.name}</div>
      <div class="header-divider"></div>
      <div class="header-title">Vendas</div>
      <div class="header-page">${pageNum} / ${totalPages}</div>
      <div class="header-divider"></div>
      <div class="header-date">Atualizado em ${genDate}</div>
    </div>
    <div class="body">
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Ontem</th>
              <th>Hoje</th>
              <th>Var % Hoje vs 4 sem.</th>
              <th>MTD</th>
              <th>Var % MTD vs Mês Ant.</th>
              <th>Forecast</th>
              <th>Orçamento</th>
            </tr>
          </thead>
          <tbody>${rowsV}</tbody>
        </table>
      </div>
    </div>`;
  container.appendChild(slideV);
  slides.push({el:slideV, dur:20000, progressPct:pageNum/totalPages*100});

  // ── Página de Cancelamentos ──
  pageNum++;
  const slideC = document.createElement('div');
  slideC.className = 'slide';

  let rowsC = '';
  squad.products.forEach(prod => {
    const c = prod.cancelamentos;
    const diaLabel = c.cancel_dia_label || 'D-1';
    const horaTxt = c.hora_atual != null ? ` <span class="sublabel">(${c.hora_atual}h)</span>` : '';
    const var4sCls = varClass(c.var_pct_vs_4s, true);
    const varMtCls = varClass(c.var_pct_mtd_vs_mes_anterior, true);
    const varFcCls = varClass(c.var_pct_mtd_vs_forecast, true);
    const varOrCls = varClass(c.var_pct_mtd_vs_orcamento, true);

    const trClsC = prod.is_total ? ' class="row-total"' : '';
    rowsC += `<tr${trClsC}>
      <td>${prod.name}</td>
      <td><span class="num">${fmt(c.cancel_ontem)}</span></td>
      <td><span class="num">${fmt(c.cancel_dia)}</span>${horaTxt}</td>
      <td><span class="var ${var4sCls}">${varArrow(c.var_pct_vs_4s)} ${fmtPct(c.var_pct_vs_4s)}</span></td>
      <td><span class="num">${fmt(c.mtd)}</span></td>
      <td><span class="var ${varMtCls}">${varArrow(c.var_pct_mtd_vs_mes_anterior)} ${fmtPct(c.var_pct_mtd_vs_mes_anterior)}</span></td>
      <td><span class="num">${fmt(c.meta_forecast_total)}</span><br><span class="var ${varFcCls}" style="font-size:18px">${varArrow(c.var_pct_mtd_vs_forecast)} ${fmtPct(c.var_pct_mtd_vs_forecast)}</span></td>
      <td><span class="num">${fmt(c.meta_orcamento_total)}</span><br><span class="var ${varOrCls}" style="font-size:18px">${varArrow(c.var_pct_mtd_vs_orcamento)} ${fmtPct(c.var_pct_mtd_vs_orcamento)}</span></td>
    </tr>`;
  });

  slideC.innerHTML = `
    <div class="header">
      <div class="header-logo">PicPay</div>
      <div class="header-divider"></div>
      <div class="header-squad">${squad.name}</div>
      <div class="header-divider"></div>
      <div class="header-title">Cancelamentos</div>
      <div class="header-page">${pageNum} / ${totalPages}</div>
      <div class="header-divider"></div>
      <div class="header-date">Atualizado em ${genDate}</div>
    </div>
    <div class="body">
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Ontem</th>
              <th>Hoje</th>
              <th>Var % Hoje vs 4 sem.</th>
              <th>MTD</th>
              <th>Var % MTD vs Mês Ant.</th>
              <th>Forecast</th>
              <th>Orçamento</th>
            </tr>
          </thead>
          <tbody>${rowsC}</tbody>
        </table>
      </div>
    </div>`;
  container.appendChild(slideC);
  slides.push({el:slideC, dur:20000, progressPct:pageNum/totalPages*100});
});

// ── Navigation ────────────────────────────────────────────────────────────────
let current = 0;
let timer = null;

function showSlide(idx) {
  slides[current].el.classList.remove('active');
  current = (idx + slides.length) % slides.length;
  const s = slides[current];
  s.el.classList.add('active');
  const gp = document.getElementById('global-progress');
  if(gp) gp.style.width = (s.progressPct||0) + '%';
  clearTimeout(timer);
  timer = setTimeout(() => showSlide(current+1), s.dur);
}

showSlide(0);

// ── Click navigation (bordas esquerda/direita) ───────────────────────────────
document.getElementById('nav-left').addEventListener('click', () => showSlide(current - 1));
document.getElementById('nav-right').addEventListener('click', () => showSlide(current + 1));

// ── Viewport scaling proporcional ─────────────────────────────────────────────
(function scaleApp() {
  const wrapper = document.getElementById('slides');
  function resize() {
    const sx = window.innerWidth  / 1920;
    const sy = window.innerHeight / 1080;
    const s  = Math.min(sx, sy);
    const slideH = Math.round(window.innerHeight / s);
    document.documentElement.style.setProperty('--slide-h', slideH + 'px');
    wrapper.style.transformOrigin = 'top left';
    wrapper.style.transform       = `scale(${s})`;
    wrapper.style.position        = 'absolute';
    wrapper.style.left            = ((window.innerWidth  - 1920 * s) / 2) + 'px';
    wrapper.style.top             = '0px';
    document.body.style.width     = window.innerWidth  + 'px';
    document.body.style.height    = window.innerHeight + 'px';
    document.body.style.overflow  = 'hidden';
  }
  resize();
  window.addEventListener('resize', resize);
})();
</script>
