<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
canvas{display:block;outline:none!important;border:none!important}
:focus{outline:none}
:root{
  --bg:#0A0F14;--card:#161B22;--border:#1E2D3D;
  --green:#00C88C;--red:#FF4D4D;--yellow:#FFD700;--blue:#00BFFF;
  --text:#E6EDF3;--muted:#8B949E;
  --splash-dur:5s;--page-dur:25s;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px}
/* ── Slides ── */
#slides{position:absolute;inset:0;width:1920px;height:var(--slide-h,1080px)}
.slide{position:absolute;inset:0;width:1920px;height:var(--slide-h,1080px);display:none;flex-direction:column;overflow:hidden}
.slide.active{display:flex}
/* ── Splash ── */
.splash{background:var(--bg);align-items:center;justify-content:center;gap:28px;flex-direction:column}
.splash-logo{opacity:1}
.splash-name{font-size:160px;font-weight:800;letter-spacing:-4px;text-align:center;line-height:1;max-width:1760px;word-break:break-word}
.splash-sub{font-size:34px;color:var(--muted);font-weight:400}
/* ── Header ── */
.header{display:flex;align-items:center;padding:0 44px;border-bottom:1px solid var(--border);height:88px;flex-shrink:0;gap:22px}
.header-logo{font-size:24px;font-weight:800;color:#00C88C;letter-spacing:-0.5px;white-space:nowrap}
.header-divider{width:1px;height:36px;background:var(--border)}
.header-product{font-size:28px;font-weight:800;color:#fff;letter-spacing:-0.5px;white-space:nowrap}
.header-title{font-size:36px;font-weight:800;color:#fff;flex:1;letter-spacing:-0.8px;line-height:1}
.header-page{font-size:18px;font-weight:700;color:#C0CAD4;white-space:nowrap}
.header-date{font-size:14px;color:var(--muted);white-space:nowrap}
/* ── Body ── */
.body{flex:1;padding:28px 40px 16px;overflow:hidden;display:flex;flex-direction:column;gap:20px}
/* ── KPI Cards ── */
.kpi-row{display:flex;gap:20px;align-items:stretch}
.kpi-card{flex:1;min-height:150px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px 28px;display:flex;flex-direction:column;gap:10px}
.kpi-label{font-size:19px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px;line-height:1.3}
.kpi-value{font-size:64px;font-weight:700;line-height:1.05;letter-spacing:-2px;color:#fff}
.kpi-value.sm{font-size:48px}
.kpi-var{font-size:26px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi-var.pos{color:var(--green)}.kpi-var.neg{color:var(--red)}.kpi-var.neu{color:var(--muted)}
.kpi-var-hero{font-size:60px;font-weight:700;letter-spacing:-2px;line-height:1.05}
.kpi-var-hero.pos{color:var(--green)}.kpi-var-hero.neg{color:var(--red)}.kpi-var-hero.neu{color:var(--muted)}
/* ── Charts ── */
.chart-wrap{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-height:0}
.charts-row{display:flex;gap:20px;flex:1;min-height:0}
.charts-row .chart-wrap{flex:1}
/* ── Gauge ── */
.gauges-row{display:flex;gap:20px}
/* ── Meta section (legado — mantido por segurança) ── */
.meta-section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px}
.meta-section-title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:14px}
.meta-kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.meta-kpi{display:flex;flex-direction:column;gap:4px}
.meta-kpi-label{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.3px;line-height:1.3}
.meta-kpi-value{font-size:20px;font-weight:700;letter-spacing:-0.5px;color:#fff}
.meta-kpi-value.sm{font-size:16px}
.meta-kpi-value.lg{font-size:28px;font-weight:800;letter-spacing:-1px;color:#fff}
.meta-kpi.prominent .meta-kpi-label{font-size:14px;color:var(--text)}
/* ── Meta cards (layout revisado) ── */
.meta-cards-row{display:flex;gap:20px;flex-shrink:0}
.meta-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 22px}
.meta-card-title{font-size:20px;font-weight:800;color:#fff;margin-bottom:14px;letter-spacing:-0.5px}
.meta-card-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border)}
.meta-col{padding:14px 16px;border-right:1px solid var(--border)}
.meta-col:last-child{border-right:none}
.meta-col-label{font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.meta-col-value{font-size:42px;font-weight:800;letter-spacing:-1.5px;color:#fff;line-height:1}
.meta-col-var{margin-top:6px;font-size:28px;font-weight:600;display:flex;gap:4px;align-items:center}
.meta-col-var.pos{color:var(--green)}.meta-col-var.neg{color:var(--red)}.meta-col-var.neu{color:var(--muted)}
/* Faixa de realizado (YTD + MTD compartilhados) */
.meta-realizado-row{display:flex;gap:20px;flex-shrink:0;margin-bottom:16px}
.meta-realizado-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 22px;display:flex;gap:0}
.meta-realizado-col{flex:1;padding:0 16px;border-right:1px solid var(--border)}
.meta-realizado-col:first-child{padding-left:0}
.meta-realizado-col:last-child{border-right:none}
.meta-realizado-label{font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.meta-realizado-value{font-size:48px;font-weight:800;letter-spacing:-2px;color:#fff;line-height:1}
/* ── Donut legend (HTML, fora do ECharts) ── */
.donut-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
.donut-chart-area{flex:1;min-height:0}
.donut-legend{flex-shrink:0;padding:0 16px 12px;display:flex;flex-direction:column;gap:20px;overflow-y:auto;max-height:44%}
.donut-legend-item{display:flex;align-items:center;gap:14px;font-size:24px;color:#E6EDF3;white-space:nowrap;overflow:hidden;font-weight:500}
.donut-legend-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0}
.donut-legend-name{overflow:hidden;text-overflow:ellipsis;flex:1;font-size:24px;font-weight:500}
.donut-legend-pct{font-size:24px;color:#C0CAD4;font-weight:700;flex-shrink:0;margin-left:4px}
/* ── Progress bar ── */
.progress-bar{position:fixed;bottom:0;left:0;right:0;height:6px;background:var(--border);z-index:9999}
.progress-fill{height:100%;background:var(--green);transition:width .3s}
/* ── Navigation zones ── */
.nav-left,.nav-right{position:fixed;top:0;height:100%;width:50%;cursor:pointer;z-index:100}
.nav-left{left:0}.nav-right{right:0}
</style>
</head>

// ── Helpers ──────────────────────────────────────────────────────────────────
const fmt = n => n==null?'—':Math.round(n).toLocaleString('pt-BR');
const fmtPct = v => v==null?'—':(v*100).toFixed(1)+'%';
const fmtMon = s => { if(!s)return''; const[y,m]=s.split('-'); const nomes=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return nomes[+m]+'/'+y.slice(2); };
const varClass = (v, isCancel=false) => { if(v==null)return'neu'; const pos=v>=0; return (pos===!isCancel)?'pos':'neg'; };
const varArrow = v => v==null?'':v>=0?'▲':'▼';
const varStr   = v => v==null?'—':Math.abs(v*100).toFixed(1)+'%';
const gaugeColor = p => p>=1?'#00C88C':p>=0.8?'#FFD700':'#FF4D4D';

const COLORS_CANAL = ['#00C88C','#00BFFF','#FFD700','#FF4D4D','#A78BFA','#FB923C','#34D399','#60A5FA'];
const COLORS_MOTIVO = ['#FF4D4D','#FFD700','#00BFFF','#A78BFA','#FB923C','#34D399','#60A5FA','#F472B6'];

function ecOpts(base){
  const defs = {
    backgroundColor:'transparent',
    grid:{top:74,right:20,bottom:56,left:16,containLabel:true},
    tooltip:{trigger:'axis',backgroundColor:'#1E2D3D',borderColor:'#1E2D3D',textStyle:{color:'#E6EDF3',fontSize:15}},
    textStyle:{color:'#E6EDF3',fontFamily:'Inter'},
    xAxis:{axisLine:{lineStyle:{color:'#30404F',width:2}},axisTick:{show:false},axisLabel:{color:'#C0CAD4',fontSize:18},splitLine:{show:false}},
    yAxis:{axisLine:{show:false},axisTick:{show:false},axisLabel:{color:'#C0CAD4',fontSize:18,formatter:v=>v===0?'0':Math.abs(v)>=1000000?(v/1000000).toFixed(1)+'M':Math.abs(v)>=1000?(v/1000).toFixed(0)+'K':v.toLocaleString('pt-BR')},splitLine:{lineStyle:{color:'#243040',type:'dashed',width:1.5}}},
  };
  const out = Object.assign({}, defs, base);
  if(base.xAxis) out.xAxis = Object.assign({}, defs.xAxis, base.xAxis, base.xAxis.axisLabel ? {axisLabel:Object.assign({},defs.xAxis.axisLabel,base.xAxis.axisLabel)} : {});
  if(base.yAxis) out.yAxis = Object.assign({}, defs.yAxis, base.yAxis, base.yAxis.axisLabel ? {axisLabel:Object.assign({},defs.yAxis.axisLabel,base.yAxis.axisLabel)} : {});
  return out;
}

// ── KPI card HTML ─────────────────────────────────────────────────────────────
function kpiCard(label, value, varPct, isCancel=false, small=false){
  const cls = varClass(varPct, isCancel);
  // Quando não há valor, a variação é o elemento principal do card → tamanho hero
  const heroClass = (varPct!=null && value==null) ? ' kpi-var-hero' : '';
  const varHtml = varPct!=null
    ? `<span class="kpi-var ${cls}${heroClass}">${varArrow(varPct)} ${varStr(varPct)}</span>` : '';
  const valHtml = value!=null ? `<div class="kpi-value${small?' sm':''}">${fmt(value)}</div>` : '';
  return `<div class="kpi-card">
    <div class="kpi-label">${label}</div>
    ${valHtml}
    ${varHtml}
  </div>`;
}

function metaKpi(label, value, prominent=false){
  const sizeCls = prominent ? 'lg' : (value>9999999?'sm':'');
  return `<div class="meta-kpi${prominent?' prominent':''}">
    <div class="meta-kpi-label">${label}</div>
    <div class="meta-kpi-value${sizeCls?' '+sizeCls:''}">${fmt(value)}</div>
  </div>`;
}

// ── Gauge (SVG puro — sem triângulo ECharts) ──────────────────────────────────
function buildGauge(el, pct, label){
  const c = gaugeColor(pct);
  const clamped = Math.min(pct, 1.5);
  const R = 70, cx = 90, cy = 80;
  // Semicírculo: 180° → 0° (esquerda para direita pelo topo)
  const angleRange = Math.PI; // 180° em radianos
  const filled = clamped / 1.5;
  const polarX = (r, a) => cx + r * Math.cos(Math.PI - a * angleRange);
  const polarY = (r, a) => cy - r * Math.sin(a * angleRange);
  const trackD = `M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy}`;
  const ex = polarX(R, filled), ey = polarY(R, filled);
  const large = filled > 0.5 ? 1 : 0;
  const fillD = filled <= 0
    ? ''
    : filled >= 1
      ? `M ${cx - R} ${cy} A ${R} ${R} 0 1 1 ${cx + R - 0.001} ${cy}`
      : `M ${cx - R} ${cy} A ${R} ${R} 0 ${large} 1 ${ex} ${ey}`;
  const pctText = (pct * 100).toFixed(1) + '%';
  el.style.width  = '100%';
  el.style.height = '90px';
  el.innerHTML = `<svg viewBox="0 0 180 95" width="100%" height="100%"
    xmlns="http://www.w3.org/2000/svg" style="display:block">
    <path d="${trackD}" fill="none" stroke="#1E2D3D" stroke-width="16" stroke-linecap="butt"/>
    ${fillD ? `<path d="${fillD}" fill="none" stroke="${c}" stroke-width="16" stroke-linecap="butt"/>` : ''}
    <text x="${cx}" y="${cy - 6}" text-anchor="middle" dominant-baseline="auto"
      font-family="Inter,sans-serif" font-size="24" font-weight="800" fill="${c}">${pctText}</text>
  </svg>`;
}

function renderVendasContratos(container, data, pid){
  const {kpis, series_30d, hoje_vendas, hora_hoje} = data;
  container.innerHTML = `
    <div class="kpi-row">
      ${kpiCard('Vendas D-1', kpis.d1, null)}
      ${kpiCard('Vendas D-2', kpis.d2, null)}
      ${kpiCard('Variação D-1 vs D-2', null, kpis.var_pct)}
    </div>
    <div class="chart-wrap" id="chart-vc-${pid}" style="flex:1"></div>`;
  // Eixo X: D-30..D-1 + "Hoje" (se disponível)
  const dates = series_30d.map(r=>r.date.slice(5));
  const maData  = series_30d.map(r=>r.mes_atual);
  const mpData  = series_30d.map(r=>r.mes_anterior);
  const hasHoje = hoje_vendas != null;
  if (hasHoje) {
    const label = hora_hoje != null ? `Hoje (${hora_hoje}h)` : 'Hoje';
    dates.push(label);
    maData.push(null);   // série "Mês atual" não tem barra hoje
    mpData.push(null);   // série "Mês anterior" não tem barra hoje
  }
  const ec = echarts.init(document.getElementById(`chart-vc-${pid}`), null, {renderer:'canvas'});
  const series = [
    {name:'Mês atual',    type:'bar',data:maData, itemStyle:{color:'#00C88C'},barMaxWidth:18,
      label:{show:true,position:'top',color:'#fff',fontSize:13,fontWeight:'bold',formatter:p=>p.value!=null&&p.value>0?fmt(p.value):''}},
    {name:'Mês anterior', type:'bar',data:mpData, itemStyle:{color:'rgba(0,200,140,0.55)'},barMaxWidth:18,label:{show:false}},
  ];
  if (hasHoje) {
    const hojeData = new Array(series_30d.length).fill(null);
    hojeData.push(hoje_vendas);
    series.push({
      name:'Hoje',
      type:'bar',
      data: hojeData,
      itemStyle:{color:'#facc15'},
      barMaxWidth:18,
      label:{show:true,position:'top',color:'#fff',fontSize:13,fontWeight:'bold',
        formatter:p=>p.value!=null&&p.value>0?fmt(p.value):''},
    });
  }
  ec.setOption(ecOpts({
    legend:{top:6,right:16,textStyle:{color:'#D0D8E4',fontSize:18,fontWeight:'600'},itemWidth:24,itemHeight:15},
    xAxis:{type:'category',data:dates,axisLabel:{rotate:45,fontSize:18,color:'#C0CAD4',interval:2}},
    yAxis:{type:'value'},
    series,
  }));
}

  const or = data.orcamento;

  // Coluna interna dos cards de meta (Meta Anual | Meta Mensal | Var vs meta mensal)
  function metaCol(label, value, varPct, isC){
    const varCls = varPct==null?'neu':varClass(varPct,isC);
    const varHtml = varPct!=null
      ? `<div class="meta-col-var ${varCls}">${varArrow(varPct)} ${varStr(varPct)}</div>` : '';
    return `<div class="meta-col">
      <div class="meta-col-label">${label}</div>
      <div class="meta-col-value">${fmt(value)}</div>
      ${varHtml}
    </div>`;
  }

  // Coluna da faixa de realizado (YTD / MTD)
  function realizadoCol(label, value){
    const sizeCls = value>9999999 ? ' style="font-size:26px"' : '';
    return `<div class="meta-realizado-col">
      <div class="meta-realizado-label">${label}</div>
      <div class="meta-realizado-value"${sizeCls}>${fmt(value)}</div>
    </div>`;
  }

  // ── Faixa de realizado: YTD Real + MTD Real (únicos, compartilhados) ──
  // Usamos os valores do Forecast como fonte canônica do realizado
  const src = fc || or;
  const realizadoHtml = src ? `
    <div class="meta-realizado-row">
      <div class="meta-realizado-card">
        ${realizadoCol('YTD Real', src.ytd)}
        ${realizadoCol('MTD Real', src.mtd)}
      </div>
    </div>` : '';

  // ── Cards de meta: Orçamento + Forecast ──
  // Cada card mostra: Meta Anual | Meta Mensal | Var MTD vs Meta Mensal
  function metaCardHtml(titulo, d){
    if(!d) return '';
    const varMtd = d.meta_mensal_mesmo_periodo > 0
      ? (d.mtd - d.meta_mensal_mesmo_periodo) / d.meta_mensal_mesmo_periodo
      : null;
    return `<div class="meta-card">
      <div class="meta-card-title">${titulo}</div>
      <div class="meta-card-grid">
        ${metaCol('Meta Anual',   d.meta_anual,   null)}
        ${metaCol('Meta Mensal',  d.meta_mensal,  null)}
        ${metaCol('MTD vs Meta',  d.mtd,          varMtd, isCancel)}
      </div>
    </div>`;
  }

  let cardsHtml = '';
  if(ho && or) cardsHtml += metaCardHtml('Orçamento', or);
  cardsHtml += metaCardHtml('Forecast', fc);

  container.innerHTML = `
    ${realizadoHtml}
    <div class="meta-cards-row">${cardsHtml}</div>
    <div class="chart-wrap" id="chart-meta-${suffix}-${pid}" style="flex:1"></div>`;

  // ── Gráfico MTD vs metas ──
  const COLOR_MTD = '#4facfe';
  const COLOR_ORC = '#facc15';
  const COLOR_FC  = '#4ade80';
  const ec = echarts.init(document.getElementById(`chart-meta-${suffix}-${pid}`), null, {renderer:'canvas'});
  const seriesMap = {};
  Object.entries(data.chart_series||{}).forEach(([serie,vals]) => seriesMap[serie]=vals);
  const dias = data.dias || [];
  const mkPt = (arr, color) => {
    const idx = arr.reduce((a,v,i)=>v!=null&&v>0?i:a, -1);
    if(idx<0) return {data:[]};
    return {data:[{coord:[idx,arr[idx]], symbol:'circle', symbolSize:17,
      itemStyle:{color,borderColor:'#fff',borderWidth:2},
      label:{show:true,position:'top',color,fontSize:17,fontWeight:700,
        formatter:()=>arr[idx]>0?fmt(arr[idx]):''}}]};
  };
  const dMTD = seriesMap['MTD Real']||[];
  const dOr  = seriesMap['Meta Orçamento (linear)']||[];
  const dFc  = seriesMap['Meta Forecast (linear)']||[];
  const lastMTD = dMTD.reduce((a,v,i)=>v!=null&&v>0?i:a,-1);
  const dMTDTrunc = lastMTD>=0 ? dMTD.map((v,i)=>i<=lastMTD?v:null) : dMTD;
  const legendData = [{name:'MTD Real',icon:'roundRect',itemStyle:{color:COLOR_MTD}}];
  const seriesArr  = [
    {name:'MTD Real', type:'line', data:dMTDTrunc, smooth:true, connectNulls:false,
      symbol:'none', lineStyle:{color:COLOR_MTD,width:5},
      areaStyle:{color:`rgba(79,172,254,0.1)`}, markPoint:mkPt(dMTD,COLOR_MTD)},
  ];
  if(ho && dOr.length){
    legendData.push({name:'Meta Orçamento',icon:'roundRect',itemStyle:{color:COLOR_ORC}});
    seriesArr.push({name:'Meta Orçamento', type:'line', data:dOr, smooth:false, connectNulls:false,
      symbol:'none', lineStyle:{color:COLOR_ORC,width:3.5,type:'dashed'}, markPoint:mkPt(dOr,COLOR_ORC)});
  }
  legendData.push({name:'Meta Forecast',icon:'roundRect',itemStyle:{color:COLOR_FC}});
  seriesArr.push({name:'Meta Forecast', type:'line', data:dFc, smooth:false, connectNulls:false,
    symbol:'none', lineStyle:{color:COLOR_FC,width:3.5,type:'dashed'}, markPoint:mkPt(dFc,COLOR_FC)});
  ec.setOption(ecOpts({
    legend:{top:6,right:16,textStyle:{color:'#D0D8E4',fontSize:18,fontWeight:'600'},itemWidth:24,itemHeight:15,data:legendData},
    xAxis:{type:'category',data:dias},
    yAxis:{type:'value'},
    series:seriesArr
  }));
}

function renderAlertas(container, data, pid){
  const {canais, hora_atual, has_alert} = data;
  if (!canais || canais.length === 0) {
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8B949E;font-size:22px;">Sem dados disponíveis para este produto hoje.</div>';
    return;
  }
  const alertCount = canais.filter(function(c){return c.em_alerta;}).length;
  const banner = has_alert
    ? '<div style="flex-shrink:0;background:rgba(255,77,77,0.12);border:1px solid #FF4D4D;border-radius:8px;padding:8px 16px;color:#FF4D4D;font-size:16px;font-weight:700;margin-bottom:8px;">&#9888; ' + alertCount + ' canal(is) abaixo do esperado &nbsp;·&nbsp; dados até ' + hora_atual + 'h</div>'
    : '<div style="flex-shrink:0;background:rgba(0,200,140,0.10);border:1px solid #00C88C;border-radius:8px;padding:8px 16px;color:#00C88C;font-size:16px;font-weight:700;margin-bottom:8px;">&#10003; Todos os canais dentro do esperado &nbsp;·&nbsp; dados até ' + hora_atual + 'h</div>';
  let cards = '';
  canais.forEach(function(c,i){
    const bColor  = c.em_alerta ? '#FF4D4D' : '#1E2D3D';
    const sColor  = c.em_alerta ? '#FF4D4D' : '#8B949E';
    const pctStr  = (c.desvio_pct > 0 ? '+' : '') + c.desvio_pct + '%';
    const icon    = c.em_alerta
      ? '<div style="position:absolute;top:8px;left:10px;background:#FF4D4D;color:#fff;font-size:13px;font-weight:900;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:1;">!</div>'
      : '';
    const padLeft = c.em_alerta ? 'padding-left:30px;' : '';
    cards += '<div style="background:#0D1B2A;border:2px solid ' + bColor + ';border-radius:10px;padding:8px;display:flex;flex-direction:column;position:relative;min-height:0;">'
           + icon
           + '<div style="text-align:center;color:#D0D8E4;font-size:15px;font-weight:700;margin-bottom:4px;' + padLeft + '">' + c.canal + '</div>'
           + '<div id="chart-al-' + pid + '-' + i + '" style="flex:1;min-height:0;"></div>'
           + '<div style="display:flex;justify-content:space-around;padding-top:6px;font-size:13px;color:' + sColor + ';font-weight:600;flex-shrink:0;">'
           +   '<span>Hoje: <b>' + c.hoje_acum + '</b></span>'
           +   '<span>Esperado: <b>' + Math.round(c.base_acum) + '</b></span>'
           +   '<span>Desvio: <b>' + pctStr + '</b></span>'
           + '</div></div>';
  });
  container.innerHTML =
    '<div style="display:flex;flex-direction:column;height:100%;padding:10px;box-sizing:border-box;">'
    + banner
    + '<div style="display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;flex:1;min-height:0;">'
    + cards
    + '</div></div>';
  canais.forEach(function(c,i){
    const el = document.getElementById('chart-al-' + pid + '-' + i);
    if (!el) return;
    const horas = Array.from({length:24},function(_,h){return h+'h';});
    const lineColor = c.em_alerta ? '#FF4D4D' : '#4facfe';
    const ec = echarts.init(el, null, {renderer:'canvas'});
    ec.setOption({
      backgroundColor:'transparent',
      grid:{top:28,bottom:28,left:44,right:12},
      legend:{top:4,right:4,textStyle:{color:'#9CA8B4',fontSize:12},itemWidth:16,itemHeight:10},
      xAxis:{type:'category',data:horas,
        axisLabel:{color:'#6B7B8D',fontSize:11,interval:3},
        axisLine:{lineStyle:{color:'#1E2D3D',width:2}},
        splitLine:{show:false}},
      yAxis:{type:'value',
        axisLabel:{color:'#6B7B8D',fontSize:11},
        splitLine:{lineStyle:{color:'#1A2A3A',type:'dashed',width:1}}},
      series:[
        {name:'Média 4 sem.',type:'line',data:c.baseline_cum,
          lineStyle:{color:'#4B5563',width:2,type:'dashed'},
          itemStyle:{color:'#4B5563'},symbol:'none',smooth:false},
        {name:'Hoje',type:'line',data:c.hoje_cum,
          lineStyle:{color:lineColor,width:3},
          itemStyle:{color:lineColor},
          symbol:'none',smooth:false,connectNulls:false},
      ]
    });
  });
}

    <div class="splash-logo" style="font-size:68px;font-weight:800;color:#00C88C;letter-spacing:-1px;text-align:center;">PicPay</div>

    <div class="splash-sub">Dashboard de Seguros</div>
    <div class="splash-sub" style="margin-top:4px;font-size:26px">Atualizado em ${genDate}</div>`;
  container.appendChild(splash);
  slides.push({el:splash, dur:5000, render:null});

  const totalPages = prod.pages.alertas != null ? 9 : 8;
  pagesDef.forEach(pg=>{
    const slide = document.createElement('div');
    slide.className = 'slide';
    const isCancel = pg.key.startsWith('cancelamentos') || pg.key.startsWith('comparacao_cancel') || pg.key.startsWith('meta_cancel');
    slide.innerHTML = `
      <div class="header">
        <div class="header-logo">PicPay</div>
        <div class="header-divider"></div>
        <div class="header-product">${prod.name}</div>
        <div class="header-divider"></div>
        <div class="header-title">${pg.title}</div>
        <div class="header-page">${pg.num} / ${totalPages}</div>
        <div class="header-divider"></div>
        <div class="header-date">Atualizado em ${genDate}</div>
      </div>
      <div class="body" id="body-${prod.id}-${pg.key}"></div>
`;    container.appendChild(slide);
    const pageData = prod.pages[pg.key];
    if(!pageData) return;
    const renderFn = (body) => {
      if(pg.key==='vendas_contratos')              renderVendasContratos(body, pageData, prod.id);
      else if(pg.key==='comparacao_vendas')        renderComparacaoVendas(body, pageData, prod.id);
      else if(pg.key==='meta_vendas')              renderMetaPage(body, pageData, prod.id, 'v', false);
      else if(pg.key==='vendas_canais')            renderVendasCanais(body, pageData, prod.id);
      else if(pg.key==='cancelamentos_contratos')  renderCancelamentosContratos(body, pageData, prod.id);
      else if(pg.key==='comparacao_cancelamentos') renderComparacaoCancelamentos(body, pageData, prod.id);
      else if(pg.key==='meta_cancelamentos')       renderMetaPage(body, pageData, prod.id, 'c', true);
      else if(pg.key==='cancelamentos_motivos')    renderCancelamentosMotivos(body, pageData, prod.id);
      else if(pg.key==='alertas')                  renderAlertas(body, pageData, prod.id);
    };
    slides.push({el:slide, dur:25000, render:renderFn, bodyId:`body-${prod.id}-${pg.key}`, progressPct:pg.num/totalPages*100});
  });
});

// ── Navigation ────────────────────────────────────────────────────────────────
let current = 0;
let timer = null;
let rendered = new Set();

function resizeCharts(body){
  body.querySelectorAll('[_echarts_instance_]').forEach(el=>{
    const inst = echarts.getInstanceByDom(el);
    if(inst) inst.resize();
  });
}

function showSlide(idx){
  slides[current].el.classList.remove('active');
  current = (idx + slides.length) % slides.length;
  const s = slides[current];
  s.el.classList.add('active');
  // Atualiza barra de progresso global (fora do wrapper escalado)
  const gp = document.getElementById('global-progress');
  if(gp) gp.style.width = (s.progressPct||0) + '%';
  // Lazy render: executa apenas na primeira visita
  if(s.render && !rendered.has(current)){
    const body = document.getElementById(s.bodyId);
    if(body){
      try{
        s.render(body);
      }catch(e){
        console.error('[TV] render erro slide '+current+':', e);
      }
      rendered.add(current);
    }
  }
  // Resize SEMPRE (display:none zera dimensões; ECharts precisa de resize a cada ativação)
  const bodyEl = document.getElementById(s.bodyId);
  if(bodyEl){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      resizeCharts(bodyEl);
      setTimeout(()=>resizeCharts(bodyEl), 200);
    }));
  }
  clearTimeout(timer);
  timer = setTimeout(()=>showSlide(current+1), s.dur);
}

function navigate(dir){
  showSlide(current + dir);
}

showSlide(0);

// ── Viewport scaling proporcional ─────────────────────────────────────────────
(function scaleApp(){
  const wrapper = document.getElementById('slides');
  function resize(){
    const sx = window.innerWidth  / 1920;
    const sy = window.innerHeight / 1080;
    const s  = Math.min(sx, sy);
    // Calcula altura lógica do slide para preencher o viewport verticalmente
    const slideH = Math.round(window.innerHeight / s);
    document.documentElement.style.setProperty('--slide-h', slideH + 'px');
    wrapper.style.transformOrigin = 'top left';
    wrapper.style.transform       = `scale(${s})`;
    wrapper.style.position        = 'absolute';
    wrapper.style.left            = ((window.innerWidth  - 1920 * s) / 2) + 'px';
    wrapper.style.top             = '0px';
    document.body.style.width     = window.innerWidth  + 'px';
    document.body.style.height    = window.innerHeight + 'px';
    document.body.style.overflow  = 'hidden';
  }
  resize();
  window.addEventListener('resize', resize);
})();
</script>
